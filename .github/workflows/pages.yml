# Oyunun statik sürümünü GitHub Pages'e yayınlar (gh-pages dalı üzerinden).
# Sunucu gerektirmez; yapay zekâ, oyuncunun ayarlardan girdiği kendi
# (ücretsiz Gemini) anahtarıyla doğrudan tarayıcıdan çalışır.
name: pages

on:
  push:
    branches: [main, claude/hayat-simulator-expansion-qo0u6v]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund
      - name: Statik oyunu derle
        run: node scripts/web-derle.mjs
      - name: gh-pages dalına yayınla
        run: |
          cd dist-web
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Yayın: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
