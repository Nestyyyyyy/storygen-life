# Oyunun statik sürümünü GitHub Pages'e yayınlar.
# Sunucu gerektirmez; yapay zekâ, oyuncunun ayarlardan girdiği kendi
# (ücretsiz Gemini) anahtarıyla doğrudan tarayıcıdan çalışır.
name: pages

on:
  push:
    branches: [main, claude/hayat-simulator-expansion-qo0u6v]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund
      - name: Statik oyunu derle
        run: node scripts/web-derle.mjs
      - name: Pages'i yapılandır
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Çıktıyı yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - name: Yayınla
        id: dagitim
        uses: actions/deploy-pages@v4
